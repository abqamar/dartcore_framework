name: tasks_api
description: The API built in the DartCore tutorial - users, JWT auth and per-user tasks on PostgreSQL (or SQLite).
publish_to: none
resolution: workspace
environment:
  sdk: ^3.10.0
dependencies:
  dartcore_framework: any
  dartcore_auth: any
  dartcore_migrations: any
  dartcore_postgres: any
  dartcore_sqlite: any
dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
