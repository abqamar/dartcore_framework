# Databases for adapter integration tests. Credentials are throwaway, local-only.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: dartcore, POSTGRES_USER: dartcore, POSTGRES_DB: dartcore_test }
    ports: ["54329:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dartcore"], interval: 2s, retries: 30 }
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: dartcore, MYSQL_DATABASE: dartcore_test }
    ports: ["33069:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdartcore"], interval: 3s, retries: 40 }
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest   # SQL Server wire-compatible, runs on arm64
    environment: { ACCEPT_EULA: "1", MSSQL_SA_PASSWORD: "DartCore_Passw0rd" }
    ports: ["14339:1433"]
